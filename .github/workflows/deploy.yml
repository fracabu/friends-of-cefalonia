name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing happens by pushing the built site to the gh-pages branch, which
# Pages serves directly. That needs only contents:write, unlike the Pages
# deployment API, which cannot create a site with the default token.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Pages keeps the custom domain as a CNAME file on the published branch,
      # and the deploy below replaces that branch wholesale. The file therefore
      # has to come out of the build, from public/CNAME: without it every push
      # to main unsets the domain and the HTTPS certificate stops being issued.
      - name: Check the custom domain survived the build
        run: test -s dist/CNAME

      # gh-pages holds only generated output, so each deploy replaces it
      # wholesale rather than accumulating history.
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
