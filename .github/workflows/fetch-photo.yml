# Una tantum: il runner delle Actions ha accesso a internet, questa sessione no.
# Scarica la fotografia di apertura da Drive e la committa nel repo, poi il
# workflow va cancellato: non serve piu' e non deve restare a girare.
name: Fetch hero photo

on:
  push:
    branches: [claude/stavamo-dicendo-4m26su]
    paths: ['.github/workflows/fetch-photo.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica da Drive
        run: |
          mkdir -p public/foto
          code=$(curl -sSL -o public/foto/hero.jpg -w '%{http_code}' \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t")
          echo "HTTP $code"
          file public/foto/hero.jpg
          test "$code" = "200"
          # Un file privato risponde con una pagina HTML, non con un'immagine.
          case "$(file -b --mime-type public/foto/hero.jpg)" in
            image/*) ;;
            *) echo "::error::Il file su Drive non e' accessibile dal link"; exit 1 ;;
          esac
        env:
          FILE_ID: 152Jrc99a0d-08ektkfnC9C94WEAU6eHf

      - name: Committa la fotografia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/foto/hero.jpg
          git commit -m "Add the opening photograph"
          git push
